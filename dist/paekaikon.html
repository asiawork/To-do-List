:root {
  --ink: #1b1b1b;
  --paper: #f6efe2;
  --dot: #e2d6bf;
  --ui: #fffaf0;
  --note-font: Mali;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 22px -12px rgba(60,40,10,.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: Mali, system-ui, sans-serif;
  font-weight: 500;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button, select { font: inherit; color: inherit; }

/* ---------- board ---------- */
#viewport {
  position: fixed; inset: 0;
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.6px, transparent 1.7px);
  background-size: 28px 28px;
  cursor: grab;
  touch-action: none;
}
#viewport.panning { cursor: grabbing; }
#layer { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }

/* ---------- notes ---------- */
.note {
  position: absolute;
  width: 220px; height: 200px;
  padding: 26px 18px 34px;
  background: var(--c, #FFE98A);
  border-radius: 3px 3px 14px 3px;
  box-shadow: var(--shadow);
  transform: rotate(var(--rot, 0deg));
  transition: box-shadow .15s, transform .15s, opacity .25s;
  cursor: grab;
}
.note::after { /* curled corner */
  content: ""; position: absolute; right: 0; bottom: 0; width: 26px; height: 26px;
  background: linear-gradient(135deg, rgba(0,0,0,.0) 50%, rgba(0,0,0,.07) 50%, rgba(255,255,255,.55) 70%);
  border-radius: 0 0 14px 0;
}
.note .tape {
  position: absolute; top: -11px; left: 50%; width: 78px; height: 24px;
  transform: translateX(-50%) rotate(var(--tape, -3deg));
  background: rgba(255,255,255,.55);
  border-left: 2px dashed rgba(0,0,0,.06); border-right: 2px dashed rgba(0,0,0,.06);
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
.note.dragging { cursor: grabbing; transform: rotate(0deg) scale(1.04); box-shadow: 0 22px 40px -14px rgba(60,40,10,.5); transition: none; }
.note.editing { cursor: text; transform: rotate(0deg); }
.note .body { height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.note .text {
  width: 100%; max-height: 100%;
  font-family: var(--note-font), Mali, sans-serif;
  font-size: var(--fs, 30px);
  line-height: 1.32;
  text-align: center;
  word-break: break-word;
  white-space: pre-wrap;
  outline: none;
  user-select: none;
}
.note.editing .text { user-select: text; caret-color: var(--ink); }
.note .text:empty::before { content: attr(data-ph); opacity: .35; }

.note .tools {
  position: absolute; left: 10px; right: 10px; bottom: 7px;
  display: flex; align-items: center; gap: 6px;
  opacity: 0; transition: opacity .15s;
}
.note:hover .tools, .note.editing .tools, .note.done .tools { opacity: 1; }
.note .tools .grow { flex: 1; }
.note .tools button {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2.5px solid var(--ink); background: rgba(255,255,255,.7);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  font-size: 15px; line-height: 1;
}
.note .tools button:hover { background: #fff; transform: translateY(-1px); }
.note .tools .check svg { opacity: 0; transition: opacity .12s; }
.note .tools .check:hover svg { opacity: .35; }
.note.done .tools .check { background: var(--ink); }
.note.done .tools .check svg { opacity: 1; stroke: #fff; }
.note .tools .swatch { background: var(--next, #fff); }
.note .tools .del { border-color: transparent; background: transparent; font-size: 20px; }
.note .tools .del:hover { background: rgba(0,0,0,.08); }

.note.done .text { opacity: .42; }
.note .stamp {
  position: absolute; right: 12px; top: 18px;
  font-family: Mali, sans-serif; font-weight: 700; font-size: 20px;
  color: #e0475b; border: 3px solid #e0475b; border-radius: 10px;
  padding: 0 9px; transform: rotate(14deg) scale(1.8); opacity: 0;
  pointer-events: none; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s;
  background: rgba(255,255,255,.35);
}
.note.done .stamp { opacity: .92; transform: rotate(14deg) scale(1); }
body.hide-done .note.done { display: none; }

.note.pop { animation: pop .32s cubic-bezier(.3,1.5,.5,1); }
@keyframes pop { from { transform: rotate(var(--rot)) scale(.6); opacity: 0; } }

/* ---------- zones ---------- */
.zone {
  position: absolute; z-index: 0; pointer-events: none;
  border-radius: 34px;
  background: color-mix(in srgb, var(--zc) 26%, transparent);
  border: 3px dashed color-mix(in srgb, var(--zc) 70%, #8a7a5c);
}
.zone.moving { box-shadow: 0 24px 50px -24px rgba(60,40,10,.35); }
.zone-head {
  position: absolute; left: 30px; top: 22px; right: 30px;
  display: flex; align-items: center; gap: 14px;
  pointer-events: auto; cursor: grab;
}
.zone.moving .zone-head { cursor: grabbing; }
.zone-title { font-family: var(--note-font), Mali, sans-serif; font-synthesis: none; font-weight: 700; font-size: 64px; line-height: 1.2; outline: none; white-space: nowrap; }
.zone-title[contenteditable="plaintext-only"], .zone-title[contenteditable="true"] { cursor: text; user-select: text; border-bottom: 4px dashed rgba(27,27,27,.25); }
.zone-count { font-size: 26px; font-weight: 700; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 22px; background: var(--ink); color: #fff; display: grid; place-items: center; }
.zone-count[hidden] { display: none; }
.zone-del { margin-left: auto; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; font-size: 30px; cursor: pointer; opacity: 0; transition: opacity .15s; }
.zone-head:hover .zone-del { opacity: .55; }
.zone-del:hover { opacity: 1 !important; background: rgba(0,0,0,.07); }
.zone-resize { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; pointer-events: auto; cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, rgba(27,27,27,.18) 50%, rgba(27,27,27,.18) 58%, transparent 58%, transparent 70%, rgba(27,27,27,.18) 70%, rgba(27,27,27,.18) 78%, transparent 78%);
  border-radius: 0 0 28px 0; }

.note .repeat { display: none; }
.note.in-routine .repeat {
  position: absolute; left: 50%; bottom: 9px; transform: translateX(-50%); z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  border: 2px solid var(--ink); border-radius: 999px; background: rgba(255,255,255,.75);
  padding: 2px 12px 2px 9px; font-size: 16px; cursor: pointer; white-space: nowrap;
}
.note.in-routine .repeat:hover { background: #fff; }
.note.in-routine.done .stamp { opacity: .55; }

/* ---------- bars ---------- */
.bar {
  position: fixed; top: 14px; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  background: var(--ui);
  border: 2.5px solid var(--ink);
  border-radius: 16px;
  padding: 7px 10px;
  box-shadow: 3px 4px 0 var(--ink);
}
.bar-left { left: 14px; }
.bar-right { right: 14px; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 6px; margin-right: 2px; border-right: 2px dashed #d9ccb4; }
.brand-mark { width: 22px; height: 20px; background: #FFE98A; border: 2.5px solid var(--ink); border-radius: 2px 2px 7px 2px; transform: rotate(-8deg); }
.brand-name { font-weight: 700; font-size: 19px; white-space: nowrap; cursor: text; outline: none; min-width: 40px; border-bottom: 2px dashed transparent; }
.brand-name:hover, .brand-name:focus { border-bottom-color: #d9ccb4; }
.swatches { display: flex; gap: 6px; }
.swatches button {
  width: 32px; height: 30px; border: 2.5px solid var(--ink); border-radius: 3px 3px 9px 3px;
  background: var(--c); cursor: pointer; padding: 0; font-weight: 700; font-size: 18px; line-height: 1;
  transform: rotate(var(--r)); transition: transform .12s;
}
.swatches button:hover { transform: rotate(0) translateY(-3px); }
.count { font-size: 15px; padding: 0 4px 0 8px; white-space: nowrap; }
.count b { font-size: 18px; }

.chip, .icon {
  border: 2px solid transparent; background: transparent; border-radius: 10px;
  padding: 4px 9px; cursor: pointer; white-space: nowrap;
}
.chip:hover, .icon:hover { background: #f1e6d0; }
.chip.on { background: var(--ink); color: #fff; }
.icon { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; font-size: 20px; }
.zoom { min-width: 62px; font-size: 14px; }
.sep { width: 2px; align-self: stretch; background: repeating-linear-gradient(#d9ccb4 0 4px, transparent 4px 7px); }
select {
  border: 2px solid var(--ink); border-radius: 10px; background: #fff; padding: 3px 8px; cursor: pointer;
}
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: -4px; top: 46px; min-width: 210px;
  background: var(--ui); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 4px 0 var(--ink);
  padding: 6px; display: flex; flex-direction: column;
}
.menu[hidden] { display: none; }
.menu button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.menu button:hover { background: #f1e6d0; }
.menu hr { border: 0; border-top: 2px dashed #d9ccb4; margin: 4px 6px; }
.menu .danger { color: #c4344a; }

/* ---------- buddy ---------- */
#buddy { position: fixed; right: 22px; bottom: -8px; z-index: 9; display: flex; align-items: flex-end; pointer-events: none; }
.buddy-body { width: 270px; cursor: pointer; pointer-events: auto; transform-origin: 50% 100%; }
.buddy-body svg { display: block; width: 100%; height: auto; overflow: visible; }
.bubble {
  font-family: var(--note-font), Mali, sans-serif;
  position: relative; margin: 0 -10px 244px 0; max-width: 290px;
  background: #fff; border: 2.5px solid var(--ink); border-radius: 18px;
  padding: 10px 16px; font-size: 19px; line-height: 1.35; box-shadow: 3px 3px 0 var(--ink);
  transition: opacity .2s, transform .2s; transform-origin: 100% 100%;
}
.bubble::after {
  content: ""; position: absolute; right: -11px; bottom: 14px; width: 16px; height: 16px;
  background: #fff; border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink);
  transform: rotate(-45deg);
}
.bubble.swap { opacity: 0; transform: scale(.9); }

.buddy-body .pose-idle, .buddy-body .pose-tea, .buddy-body .pose-drink { animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.buddy-body .pose-sleep { animation: breathe 4.6s ease-in-out infinite; transform-origin: 50% 100%; }
.buddy-body .pose-cheer { animation: hop .5s ease-in-out infinite alternate; }
.buddy-body .pose-carry { animation: wobble .6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.buddy-body .pose-write .pencil { animation: scribble .35s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 116px 184px; }
.buddy-body .wave-arm { animation: wave .45s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 134px 150px; }
.buddy-body .zzz text { animation: float 2.4s ease-in-out infinite; }
.buddy-body .zzz text:nth-child(2) { animation-delay: .3s; }
.buddy-body .zzz text:nth-child(3) { animation-delay: .6s; }
.buddy-body .steam path { animation: float 2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scaleY(1.018); } }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-12px); } }
@keyframes wobble { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
@keyframes scribble { from { transform: rotate(-6deg) translateX(-2px); } to { transform: rotate(6deg) translateX(3px); } }
@keyframes float { 50% { transform: translateY(-5px); opacity: .6; } }
.buddy-body.boing { animation: boing .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes boing { 30% { transform: scale(1.08, .92); } 60% { transform: scale(.96, 1.05); } }

/* ---------- fx + toast ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.bit { position: absolute; width: 10px; height: 8px; border: 1.5px solid var(--ink); border-radius: 1px; animation: burst .9s cubic-bezier(.2,.7,.4,1) forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rr)); opacity: 0; } }

#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 30;
  background: var(--ink); color: #fff; border-radius: 14px; padding: 9px 10px 9px 16px;
  display: flex; align-items: center; gap: 12px; font-size: 16px;
}
#toast[hidden] { display: none; }
#toast button { border: 0; border-radius: 9px; background: #FFE98A; color: var(--ink); padding: 4px 12px; cursor: pointer; font-weight: 700; }

@media (max-width: 1100px) {
  .bar-right .chip:not(.zoom) { display: none; }
  .count { display: none; }
}

/* ---------- look panel ---------- */
#lookPanel {
  position: fixed; right: 300px; bottom: 24px; z-index: 25; width: 470px;
  background: var(--ui); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 4px 5px 0 var(--ink);
  padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px;
}
#lookPanel[hidden] { display: none; }
.look-head { display: flex; align-items: center; justify-content: space-between; font-size: 18px; }
.look-row { display: flex; align-items: center; gap: 10px; }
.look-row > span { width: 84px; flex: none; font-size: 15px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button {
  min-width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--c, #fff);
  cursor: pointer; padding: 0;
}
.opts button.txt { border-radius: 10px; padding: 0 10px; background: #fff; font-size: 14px; }
.opts button.on { box-shadow: 0 0 0 3px var(--ui), 0 0 0 5.5px var(--ink); }
.opts button.txt.on { background: var(--ink); color: #fff; box-shadow: none; }
.toggles { flex-wrap: wrap; gap: 6px 16px; font-size: 15px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--ink); }
#lookReset { align-self: flex-start; border: 2px solid var(--ink); font-size: 14px; }
#buddy.hidden { display: none; }
#buddy.dressing .bubble { visibility: hidden; }
.opts button.hair-thumb {
  width: 48px; height: 60px; border-radius: 11px; background: #fff; padding: 2px 1px 0;
  display: flex; flex-direction: column; align-items: center; gap: 1px; overflow: hidden;
}
.opts button.hair-thumb svg { width: 44px; height: 55px; display: block; }

.opts button.hair-thumb.on { background: #f1e6d0; box-shadow: 0 0 0 3px var(--ui), 0 0 0 5.5px var(--ink); }
.look-row:has(.opts[data-key="hair"]) { align-items: flex-start; }
.look-row:has(.opts[data-key="hair"]) > span { padding-top: 6px; }

/* ---------- stickers ---------- */
.sticker-wrap { position: relative; }
.sticker-btn { width: 38px; height: 38px; }
.tray {
  position: absolute; left: -6px; top: 48px; z-index: 30; width: 330px;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  background: var(--ui); border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 3px 4px 0 var(--ink); padding: 8px;
}
.tray[hidden] { display: none; }
.tray button { border: 0; background: transparent; border-radius: 12px; padding: 4px; cursor: pointer; aspect-ratio: 1; }
.tray button:hover { background: #f1e6d0; transform: rotate(-4deg) scale(1.06); }
.tray svg { width: 100%; height: 100%; display: block; }
.sticker {
  position: absolute; cursor: grab; touch-action: none;
  transform: rotate(var(--rot, 0deg));
  filter: drop-shadow(0 3px 2px rgba(60,40,10,.18));
}
.sticker svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.sticker.dragging { cursor: grabbing; filter: drop-shadow(0 12px 10px rgba(60,40,10,.3)); }
.sticker.pop { animation: pop .32s cubic-bezier(.3,1.5,.5,1); }
.sticker .s-del, .sticker .s-size {
  position: absolute; width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff;
  display: grid; place-items: center; opacity: 0; transition: opacity .12s; padding: 0; font-size: 16px; line-height: 1;
}
.sticker .s-del { right: -8px; top: -8px; cursor: pointer; }
.sticker .s-size { right: -8px; bottom: -8px; cursor: nwse-resize; }
.sticker:hover .s-del, .sticker:hover .s-size { opacity: 1; }
.dress-btn {
  position: absolute; right: 6px; bottom: 150px; pointer-events: auto; z-index: 2;
  width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff;
  box-shadow: 2px 3px 0 var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
  transition: transform .15s;
}
.dress-btn:hover { transform: rotate(-10deg) scale(1.08); }
#buddy.dressing .dress-btn { background: #f1e6d0; }

</style>
</head>

<script>
// น้องโน้ต — original doodle character for แปะไว้ก่อน
// Each pose is composed from shared parts; `look` changes colors, hairstyle and accessories.
(function () {
  const INK = '#1b1b1b';
  const DEFAULT_LOOK = {
    hair: 'long', hairColor: '#1b1b1b', skin: '#ffffff', shirt: '#ffffff',
    note: '#FFE98A', glasses: true, blush: true, show: true,
  };

  const line = (d, w = 4) =>
    `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

  // union of circles with one clean ink outline: outline layer first, fill layer on top
  const blob = (circles, fill) =>
    circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + 1.75}" fill="${INK}"/>`).join('') +
    circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r - 1.75}" fill="${fill}"/>`).join('');
  const CURLY_BACK = [];
  for (let t = -28; t <= 208; t += 20) {
    const a = t * Math.PI / 180;
    CURLY_BACK.push([+(100 + 37 * Math.cos(a)).toFixed(1), +(74 - 37 * Math.sin(a)).toFixed(1), 13]);
  }
  CURLY_BACK.push([100, 62, 30]);
  const CURLY_FRINGE = [[72, 62, 8], [81, 56, 9], [91, 53, 9], [101, 52, 9], [111, 53, 9], [120, 56, 9], [128, 62, 8]];

  function parts(L) {
    const outline = L.hairColor.toLowerCase() === INK ? '' : ` stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"`;
    // doodle limb: thick ink outline with skin inside
    const limb = (d, cls = '') =>
      `<g class="${cls}"><path d="${d}" fill="none" stroke="${INK}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="${d}" fill="none" stroke="${L.skin}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>`;

    const hairBackShapes = {
      long: 'M100 30 C55 30 48 70 52 110 C54 140 40 160 48 185 C52 200 44 210 50 224 L150 224 C156 207 148 195 152 180 C158 155 146 140 148 110 C152 70 145 30 100 30 Z',
      bob: 'M100 30 C56 30 50 68 53 104 C54 120 56 132 70 134 L130 134 C144 132 146 120 147 104 C150 68 144 30 100 30 Z',
      pony: 'M100 32 C61 32 57 66 61 98 L139 98 C143 66 139 32 100 32 Z',
      sidepart: 'M100 30 C60 30 55 58 60 90 L67 90 L67 70 L133 70 L133 90 L140 90 C145 58 140 30 100 30 Z',
      short: 'M100 31 C60 31 56 60 61 88 L67 88 L67 70 L133 70 L133 88 L139 88 C144 60 140 31 100 31 Z',
    };
    const headHair = ['short', 'pony', 'sidepart', 'curly'].includes(L.hair); // short styles tilt with the head
    const hairBack = L.hair === 'curly'
      ? blob(CURLY_BACK, L.hairColor)
      : `<path d="${hairBackShapes[L.hair] || hairBackShapes.long}" fill="${L.hairColor}"${outline}/>`;
    // ponytail swinging out behind the right side of the head, with a hair tie
    // ponytail hangs behind the shoulders (body layer); the hair tie sits on the head
    const ponyTail = L.hair === 'pony'
      ? `<path d="M124 44 C147 40 160 60 157 86 C155 108 160 126 150 144 C144 130 135 118 137 96 C138 80 134 66 120 58 Z" fill="${L.hairColor}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>` +
        line('M146 72 Q150 92 147 112', 2.4)
      : '';
    const bun = L.hair === 'pony'
      ? `<ellipse cx="129" cy="50" rx="6" ry="7.5" transform="rotate(-30 129 50)" fill="${L.note}" stroke="${INK}" stroke-width="3"/>`
      : '';
    const neck = `<rect x="91" y="106" width="18" height="34" fill="${L.skin}"/>` + line('M91 108 L91 140 M109 108 L109 140', 3.5);
    const shirt = `<path d="M56 224 C56 172 66 142 86 134 Q100 146 114 134 C134 142 144 172 144 224 Z" fill="${L.shirt}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    const face = `<ellipse cx="100" cy="80" rx="33" ry="38" fill="${L.skin}" stroke="${INK}" stroke-width="4"/>`;
    // hair cap: covers the whole top of the face outline so no head line shows through the hair;
    // only the hairline (where hair meets skin) gets an ink line
    const cap = (y, hairline) => {
      const dx = 35.8 * Math.sqrt(1 - Math.pow((y - 80) / 40.8, 2));
      const L1 = (100 - dx).toFixed(1), R1 = (100 + dx).toFixed(1);
      return `<path d="M${L1} ${y} A35.8 40.8 0 ${y > 80 ? 1 : 0} 1 ${R1} ${y} L${hairline} Z" fill="${L.hairColor}"/>` +
        (outline ? line('M' + hairline, 3) : '');
    };

    // without glasses the eyes get bigger, with a little shine, so the face doesn't look empty

  const poses = {

<script>
(() => {
  'use strict';

  const COLORS = [
    { c: '#FFE98A', name: 'เหลือง' },
    { c: '#FFC6D3', name: 'ชมพู' },
    { c: '#BDE3FF', name: 'ฟ้า' },
    { c: '#C9F0C2', name: 'เขียว' },
    { c: '#DCCBFF', name: 'ม่วง' },
    { c: '#FFD3A8', name: 'ส้ม' },
  ];
  const KEY = 'paekaikon-board-v1';
  const NOTE_W = 220, NOTE_H = 200;
  const MIN_Z = 0.25, MAX_Z = 2;
  const ZONE_W = 540, ZONE_H = 1250, ZONE_GAP = 60;
  const ZONE_TINTS = ['#FFE98A', '#BDE3FF', '#FFC6D3', '#C9F0C2', '#DCCBFF', '#FFD3A8'];

  const $ = (s) => document.querySelector(s);
  const viewport = $('#viewport'), layer = $('#layer');

  // ---------- state ----------
  let state = load() || seed();
  let editingId = null, draggingId = null;
  let lastActivity = Date.now();
  let cheerUntil = 0, waveUntil = Date.now() + 3500;
  let undoStack = [];

  function defaultZones() {
    return ['Routine', 'Project', 'Meeting', 'Adhoc'].map((name, i) => ({
      id: uid(), name, x: i * (ZONE_W + ZONE_GAP), y: 0, w: ZONE_W, h: ZONE_H,
      tint: ZONE_TINTS[i], routine: i === 0,
    }));
  }
  function seed() {
    const now = Date.now();
    const zx = (i) => i * (ZONE_W + ZONE_GAP);
    const note = (text, i, row, col, color, extra) => ({
      id: uid(), text, x: zx(i) + 36 + col * 250, y: 130 + row * 240, color, rot: [-2, 1.5, -1, 2.5][(i + row + col) % 4],
      done: false, z: 1, t: now, ...extra,
    });
    return {
      zones: defaultZones(),
      notes: [
        note('เช็กอีเมลตอนเช้า', 0, 0, 0, COLORS[0].c, { repeat: 'day' }),
        note('ส่งรายงานประจำสัปดาห์', 0, 0, 1, COLORS[2].c, { repeat: 'week' }),
        note('ร่างโครงหน้าเว็บใหม่', 1, 0, 0, COLORS[3].c),
        note('เตรียมสรุปก่อนประชุมทีม', 2, 0, 0, COLORS[1].c),
        note('ตอบคำถาม IC', 3, 0, 0, COLORS[5].c),
      ],
      view: { x: 60, y: 110, s: 0.55 },
      font: 'Mali',
      hideDone: false,
      z: 5,
    };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.notes)) { if (!Array.isArray(s.zones)) s.zones = defaultZones(); return s; }
    } catch (e) {}
    return null;
  }
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, 150);
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  const byId = (id) => state.notes.find((n) => n.id === id);
  const elOf = (id) => layer.querySelector(`.note[data-id="${id}"]`);
  const zoneById = (id) => state.zones.find((z) => z.id === id);
  const zoneEl = (id) => layer.querySelector(`.zone[data-id="${id}"]`);
  function zoneOf(n) {
    const cx = n.x + NOTE_W / 2, cy = n.y + NOTE_H / 2;
    for (let i = state.zones.length - 1; i >= 0; i--) {
      const z = state.zones[i];
      if (cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h) return z;
    }
    return null;
  }
  const inRoutine = (n) => !!(zoneOf(n) || {}).routine;

  // ---------- view ----------
  function applyView() {
    const { x, y, s } = state.view;
    layer.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    const g = 28 * s;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${x}px ${y}px`;
    $('#zoomLabel').textContent = Math.round(s * 100) + '%';
  }
  const toBoard = (cx, cy) => ({ x: (cx - state.view.x) / state.view.s, y: (cy - state.view.y) / state.view.s });

  function zoomAt(cx, cy, factor) {
    const v = state.view;
    const ns = Math.min(MAX_Z, Math.max(MIN_Z, v.s * factor));
    const k = ns / v.s;
    v.x = cx - (cx - v.x) * k;
    v.y = cy - (cy - v.y) * k;
    v.s = ns;
    applyView(); save();
  }
  function animateView(target) {
    const from = { ...state.view }, t0 = performance.now(), dur = 380;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      state.view.x = from.x + (target.x - from.x) * e;
      state.view.y = from.y + (target.y - from.y) * e;
      state.view.s = from.s + (target.s - from.s) * e;
      applyView();
      if (p < 1) requestAnimationFrame(step); else save();
    };
    requestAnimationFrame(step);
  }
  // fit the whole board to the window; when the zones sit in one row, stretch
  // their height so the row fills the screen exactly
  const TOP = 78, SIDE = 18, BOTTOM = 14;
  function fitAll(instant) {
    const W = innerWidth - SIDE * 2, H = innerHeight - TOP - BOTTOM;
    const zs = state.zones;
    if (zs.length && zs.every((z) => z.y === zs[0].y && z.h === zs[0].h)) {
      const rowW = Math.max(...zs.map((z) => z.x + z.w)) - Math.min(...zs.map((z) => z.x));
      const lowest = Math.max(0, ...state.notes.filter((n) => zoneOf(n)).map((n) => n.y + NOTE_H + 30 - zs[0].y));
      const h = Math.max(600, lowest, Math.round(rowW * H / W));
      zs.forEach((z) => { z.h = h; renderZone(z); });
    }
    const boxes = state.notes.filter((n) => !(state.hideDone && n.done)).map((n) => ({ x: n.x, y: n.y, w: NOTE_W, h: NOTE_H }))
      .concat(zs.map((z) => ({ x: z.x, y: z.y, w: z.w, h: z.h })));
    if (!boxes.length) return animateView({ x: 120, y: 120, s: 1 });
    const minX = Math.min(...boxes.map((b) => b.x)), minY = Math.min(...boxes.map((b) => b.y));
    const maxX = Math.max(...boxes.map((b) => b.x + b.w)), maxY = Math.max(...boxes.map((b) => b.y + b.h));
    const sc = Math.min(1.25, Math.max(MIN_Z, Math.min(W / (maxX - minX), H / (maxY - minY))));
    const target = { s: sc, x: SIDE + (W - (maxX - minX) * sc) / 2 - minX * sc, y: TOP + (H - (maxY - minY) * sc) / 2 - minY * sc };
    if (instant === true) { Object.assign(state.view, target); applyView(); save(); }
    else animateView(target);
  }

  // ---------- notes ----------
  function fontSizeFor(text) {
    const len = [...(text || '')].length;
    if (len <= 6) return 42;
    if (len <= 12) return 36;
    if (len <= 22) return 30;
    if (len <= 40) return 25;
    if (len <= 70) return 21;
    return 17;
  }
  function nextColor(c) {
    const i = COLORS.findIndex((x) => x.c === c);
    return COLORS[(i + 1) % COLORS.length].c;
  }

  const REPEAT_LABEL = { day: 'ทุกวัน', week: 'ทุกสัปดาห์', month: 'ทุกเดือน' };
  const REPEAT_NEXT = { day: 'week', week: 'month', month: 'day' };
  const REPEAT_ICON = '<svg viewBox="0 0 24 24" width="15" height="15"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHECK_SVG = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderNote(n, pop) {
    let el = elOf(n.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'note';
      el.dataset.id = n.id;
      el.innerHTML =
        '<div class="tape"></div>' +
        '<div class="body"><div class="text" data-ph="งานที่ต้องทำ" spellcheck="false"></div></div>' +
        '<div class="stamp">เสร็จ!</div>' +
        '<button class="repeat" title="รอบของงานประจำ"></button>' +
        '<div class="tools">' +
          `<button class="check" title="เสร็จแล้ว">${CHECK_SVG}</button>` +
          '<span class="grow"></span>' +
          '<button class="swatch" title="เปลี่ยนสี"></button>' +
          '<button class="del" title="ลบ">×</button>' +
        '</div>';
      layer.appendChild(el);
      if (pop) { el.classList.add('pop'); el.addEventListener('animationend', () => el.classList.remove('pop'), { once: true }); }
    }
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.zIndex = n.z;
    el.style.setProperty('--c', n.color);
    el.style.setProperty('--rot', n.rot + 'deg');
    el.style.setProperty('--tape', (n.rot * -1.4 - 2) + 'deg');
    el.style.setProperty('--next', nextColor(n.color));
    el.classList.toggle('done', !!n.done);
    const routine = inRoutine(n);
    el.classList.toggle('in-routine', routine);
    if (routine) el.querySelector('.repeat').innerHTML = REPEAT_ICON + REPEAT_LABEL[n.repeat || 'day'];
    const t = el.querySelector('.text');
    if (editingId !== n.id && t.textContent !== n.text) t.textContent = n.text;
    t.style.setProperty('--fs', fontSizeFor(n.text) + 'px');
    return el;
  }
  function renderZone(z) {
    let el = zoneEl(z.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'zone';
      el.dataset.id = z.id;
      el.innerHTML =
        '<div class="zone-head"><div class="zone-title" spellcheck="false"></div><span class="zone-count"></span>' +
        '<button class="zone-del" title="ลบโซน">×</button></div>' +
        '<div class="zone-resize" title="ปรับขนาดโซน"></div>';
      layer.insertBefore(el, layer.querySelector('.note'));
    }
    el.style.left = z.x + 'px'; el.style.top = z.y + 'px';
    el.style.width = z.w + 'px'; el.style.height = z.h + 'px';
    el.style.setProperty('--zc', z.tint);
    el.classList.toggle('routine', !!z.routine);
    const t = el.querySelector('.zone-title');
    if (document.activeElement !== t && t.textContent !== z.name) t.textContent = z.name;
    return el;
  }
  function renderZoneCounts() {
    const counts = {};
    state.notes.forEach((n) => { if (!n.done) { const z = zoneOf(n); if (z) counts[z.id] = (counts[z.id] || 0) + 1; } });
    state.zones.forEach((z) => {
      const el = zoneEl(z.id); if (!el) return;
      const c = el.querySelector('.zone-count');
      c.textContent = counts[z.id] || '';
      c.hidden = !counts[z.id];
    });
  }
  function renderAll() {
    const zids = new Set(state.zones.map((z) => z.id));
    layer.querySelectorAll('.zone').forEach((el) => { if (!zids.has(el.dataset.id)) el.remove(); });
    state.zones.forEach(renderZone);
    const ids = new Set(state.notes.map((n) => n.id));
    layer.querySelectorAll('.note').forEach((el) => { if (!ids.has(el.dataset.id)) el.remove(); });
    state.notes.forEach((n) => renderNote(n));
    document.documentElement.style.setProperty('--note-font', state.font);
    $('#fontSelect').value = state.font;
    document.body.classList.toggle('hide-done', !!state.hideDone);
    $('#toggleDone').classList.toggle('on', !!state.hideDone);
    renderCount();
    updateBuddy();
  }
  function renderCount() {
    renderZoneCounts();
    const total = state.notes.length, done = state.notes.filter((n) => n.done).length;
    const left = total - done;
    $('#count').innerHTML = total ? `เหลือ <b>${left}</b> จาก ${total} งาน` : 'กระดานว่าง';
  }

  function addNote(x, y, color) {
    const n = {
      id: uid(), text: '', x: Math.round(x), y: Math.round(y),
      color: color || COLORS[Math.floor(Math.random() * COLORS.length)].c,
      rot: +(Math.random() * 5 - 2.5).toFixed(1), done: false, z: ++state.z, t: Date.now(), fresh: true,
    };
    if (inRoutine(n)) n.repeat = 'day';
    state.notes.push(n);
    renderNote(n, true);
    renderCount();
    startEdit(n.id);
    save();
    return n;
  }
  // find the nearest empty spot so a new note never lands on top of another
  function freeSpot(x0, y0) {
    const gap = 26, stepX = NOTE_W + gap, stepY = NOTE_H + gap;
    const hits = (x, y) => state.notes.some((n) => !(state.hideDone && n.done) &&
      x < n.x + NOTE_W + gap && x + NOTE_W + gap > n.x && y < n.y + NOTE_H + gap && y + NOTE_H + gap > n.y);
    for (let r = 0; r < 12; r++) {
      const ring = [];
      for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) {
        if (Math.max(Math.abs(i), Math.abs(j)) !== r) continue;
        ring.push({ x: x0 + i * stepX * 0.5, y: y0 + j * stepY * 0.5, d: i * i + j * j });
      }
      ring.sort((a, b) => a.d - b.d);
      const ok = ring.find((p) => !hits(p.x, p.y));
      if (ok) return ok;
    }
    return { x: x0 + Math.random() * 80, y: y0 + Math.random() * 80 };
  }
  function addNoteInView(color) {
    const c = toBoard(innerWidth / 2, innerHeight / 2 + 30);
    const p = freeSpot(c.x - NOTE_W / 2, c.y - NOTE_H / 2);
    addNote(p.x, p.y, color);
  }

  function removeNotes(ids, msg) {
    const removed = state.notes.filter((n) => ids.includes(n.id));
    if (!removed.length) return;
    state.notes = state.notes.filter((n) => !ids.includes(n.id));
    removed.forEach((n) => { const el = elOf(n.id); if (el) el.remove(); });
    if (removed.some((n) => n.text.trim())) {
      undoStack.push({ notes: removed.map((n) => ({ ...n })), zones: [] });
      showToast(msg || 'ลบโน้ตแล้ว');
    }
    renderCount(); updateBuddy(); save();
  }
  function undo() {
    const last = undoStack.pop();
    if (!last) return;
    last.zones.forEach((z) => { state.zones.push(z); renderZone(z); });
    (last.stickers || []).forEach((k) => { state.stickers.push(k); renderSticker(k, true); });
    last.notes.forEach((n) => { state.notes.push(n); renderNote(n, true); });
    state.notes.forEach((n) => renderNote(n));
    hideToast(); renderCount(); updateBuddy(); save();
  }

  function toggleDone(id) {
    const n = byId(id); if (!n) return;
    n.done = !n.done;
    if (n.done) n.doneAt = Date.now(); else delete n.doneAt;
    renderNote(n); renderCount();
    if (n.done) {
      const r = elOf(id).getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, n.color);
      cheerUntil = Date.now() + 2600;
      sayCheer();
    }
    updateBuddy(); save();
  }

  // ---------- editing ----------
  function startEdit(id) {
    if (editingId && editingId !== id) endEdit();
    const el = elOf(id); if (!el) return;
    editingId = id;
    const n = byId(id); n.z = ++state.z; el.style.zIndex = n.z;
    el.classList.add('editing');
    const t = el.querySelector('.text');
    t.contentEditable = 'plaintext-only';
    if (t.contentEditable !== 'plaintext-only') t.contentEditable = 'true';
    t.focus();
    const range = document.createRange(); range.selectNodeContents(t); range.collapse(false);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    updateBuddy();
  }
  function endEdit() {
    if (!editingId) return;
    const id = editingId; editingId = null;
    const el = elOf(id), n = byId(id);
    if (el) {
      const t = el.querySelector('.text');
      t.contentEditable = 'false';
      el.classList.remove('editing');
      if (n) n.text = t.textContent.replace(/\s+$/,'').replace(/^\s+/, '');
    }
    if (n) {
      delete n.fresh;
      if (!n.text) { removeNotes([id]); }
      else renderNote(n);
    }
    getSelection().removeAllRanges();
    updateBuddy(); save();
  }

  layer.addEventListener('input', (e) => {
    const t = e.target.closest('.text'); if (!t) return;
    const n = byId(t.closest('.note').dataset.id); if (!n) return;
    n.text = t.textContent;
    t.style.setProperty('--fs', fontSizeFor(n.text) + 'px');
    lastActivity = Date.now();
    save();
  });
  layer.addEventListener('keydown', (e) => {
    if (!e.target.closest('.text')) return;
    if ((e.key === 'Enter' && !e.shiftKey) || e.key === 'Escape') { e.preventDefault(); e.target.blur(); }
  });
  layer.addEventListener('focusout', (e) => { if (e.target.closest('.text')) endEdit(); });
  layer.addEventListener('paste', (e) => {
    if (!e.target.closest('.text')) return;
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, txt);
  });

  // ---------- pointer: notes ----------
  layer.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.note'); if (!el) return;
    e.stopPropagation();
    lastActivity = Date.now();
    const id = el.dataset.id, n = byId(id);
    const btn = e.target.closest('button');
    if (btn) return; // handled on click
    if (editingId === id && e.target.closest('.text')) return; // let caret move
    e.preventDefault();
    if (editingId && editingId !== id) endEdit();
    n.z = ++state.z; el.style.zIndex = n.z;
    const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
    let moved = false;
    el.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const dx = (ev.clientX - sx) / state.view.s, dy = (ev.clientY - sy) / state.view.s;
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 4) {
        moved = true; draggingId = id; el.classList.add('dragging');
        if (editingId === id) endEdit();
        updateBuddy();
      }
      if (moved) { n.x = Math.round(ox + dx); n.y = Math.round(oy + dy); el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      if (moved) {
        el.classList.remove('dragging'); draggingId = null;
        if (inRoutine(n) && !n.repeat) n.repeat = 'day';
        renderNote(n); renderCount(); save(); updateBuddy();
      }
      else startEdit(id);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
  layer.addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    const el = btn.closest('.note'); if (!el) return;
    const id = el.dataset.id; const n = byId(id);
    if (!el) return;
    if (btn.classList.contains('repeat')) { n.repeat = REPEAT_NEXT[n.repeat || 'day']; renderNote(n); save(); return; }
    if (btn.classList.contains('check')) { if (editingId === id) endEdit(); if (byId(id)) toggleDone(id); }
    else if (btn.classList.contains('swatch')) { n.color = nextColor(n.color); renderNote(n); save(); }
    else if (btn.classList.contains('del')) { if (editingId === id) { editingId = null; } removeNotes([id]); }
  });
  layer.addEventListener('mousedown', (e) => { if (e.target.closest('.note button')) e.preventDefault(); }); // keep focus while clicking tools

  // ---------- pointer: board ----------
  let spaceDown = false;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.note, .zone-head, .zone-resize, .sticker')) return;
    lastActivity = Date.now();
    if (editingId) endEdit();
    const sx = e.clientX, sy = e.clientY, ox = state.view.x, oy = state.view.y;
    viewport.setPointerCapture(e.pointerId);
    viewport.classList.add('panning');
    const move = (ev) => { state.view.x = ox + ev.clientX - sx; state.view.y = oy + ev.clientY - sy; applyView(); };
    const up = () => {
      viewport.classList.remove('panning');
      viewport.removeEventListener('pointermove', move);
      viewport.removeEventListener('pointerup', up);
      viewport.removeEventListener('pointercancel', up);
      save();
    };
    viewport.addEventListener('pointermove', move);
    viewport.addEventListener('pointerup', up);
    viewport.addEventListener('pointercancel', up);
  });
  viewport.addEventListener('dblclick', (e) => {
    if (e.target.closest('.note')) return;
    const p = toBoard(e.clientX, e.clientY);
    addNote(p.x - NOTE_W / 2, p.y - NOTE_H / 2);
  });
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    lastActivity = Date.now();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022));
    else { state.view.x -= e.deltaX; state.view.y -= e.deltaY; applyView(); save(); }
  }, { passive: false });

  // ---------- zones ----------
  layer.addEventListener('pointerdown', (e) => {
    const zEl = e.target.closest('.zone'); if (!zEl) return;
    const head = e.target.closest('.zone-head'), handle = e.target.closest('.zone-resize');
    if (!head && !handle) return;
    if (e.target.closest('.zone-del')) return;
    const title = zEl.querySelector('.zone-title');
    if (head && document.activeElement === title && e.target === title) return; // caret
    e.stopPropagation(); e.preventDefault();
    if (editingId) endEdit();
    lastActivity = Date.now();
    const z = zoneById(zEl.dataset.id);
    const sx = e.clientX, sy = e.clientY, o = { ...z };
    // notes that travel with the zone
    const riders = head ? state.notes.filter((n) => zoneOf(n) === z).map((n) => ({ n, x: n.x, y: n.y })) : [];
    let moved = false;
    zEl.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const dx = (ev.clientX - sx) / state.view.s, dy = (ev.clientY - sy) / state.view.s;
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 4) { moved = true; zEl.classList.add('moving'); }
      if (!moved) return;
      if (handle) { z.w = Math.max(280, Math.round(o.w + dx)); z.h = Math.max(300, Math.round(o.h + dy)); }
      else {
        z.x = Math.round(o.x + dx); z.y = Math.round(o.y + dy);
        riders.forEach((r) => { r.n.x = Math.round(r.x + dx); r.n.y = Math.round(r.y + dy); const ne = elOf(r.n.id); ne.style.left = r.n.x + 'px'; ne.style.top = r.n.y + 'px'; });
      }
      renderZone(z);
    };
    const up = () => {
      zEl.removeEventListener('pointermove', move); zEl.removeEventListener('pointerup', up); zEl.removeEventListener('pointercancel', up);
      zEl.classList.remove('moving');
      if (!moved && head) {
        title.contentEditable = 'plaintext-only';
        if (title.contentEditable !== 'plaintext-only') title.contentEditable = 'true';
        title.focus();
        const r = document.createRange(); r.selectNodeContents(title); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      }
      state.notes.forEach((n) => renderNote(n)); renderCount(); save();
    };
    zEl.addEventListener('pointermove', move); zEl.addEventListener('pointerup', up); zEl.addEventListener('pointercancel', up);
  });
  layer.addEventListener('keydown', (e) => {
    if (!e.target.classList.contains('zone-title')) return;
    if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); e.target.blur(); }
  });
  layer.addEventListener('focusout', (e) => {
    const t = e.target; if (!t.classList || !t.classList.contains('zone-title')) return;
    t.contentEditable = 'false';
    const z = zoneById(t.closest('.zone').dataset.id);
    const name = t.textContent.trim();
    if (z) { if (name) z.name = name; t.textContent = z.name; save(); }
  });
  layer.addEventListener('click', (e) => {
    const del = e.target.closest('.zone-del'); if (!del) return;
    const z = zoneById(del.closest('.zone').dataset.id); if (!z) return;
    state.zones = state.zones.filter((x) => x !== z);
    zoneEl(z.id).remove();
    undoStack.push({ notes: [], zones: [{ ...z }] });
    showToast(`ลบโซน ${z.name} แล้ว`);
    state.notes.forEach((n) => renderNote(n)); renderCount(); save();
  });
  function addZone() {
    const right = state.zones.length ? Math.max(...state.zones.map((z) => z.x + z.w)) + ZONE_GAP : 0;
    const top = state.zones.length ? Math.min(...state.zones.map((z) => z.y)) : 0;
    const z = { id: uid(), name: 'โซนใหม่', x: right, y: top, w: ZONE_W, h: ZONE_H, tint: ZONE_TINTS[state.zones.length % ZONE_TINTS.length], routine: false };
    state.zones.push(z); renderZone(z); save();
    const s = state.view.s;
    animateView({ s, x: innerWidth / 2 - (z.x + z.w / 2) * s, y: state.view.y });
  }

  // routine notes come back undone when their period rolls over
  const pad2 = (v) => String(v).padStart(2, '0');
  function periodKey(ts, repeat) {
    const d = new Date(ts);
    if (repeat === 'month') return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    if (repeat === 'week') { const m = new Date(d); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return 'w' + m.toDateString(); }
    return d.toDateString();
  }
  function resetRoutines() {
    const now = Date.now();
    let back = 0;
    state.notes.forEach((n) => {
      if (!n.done || !inRoutine(n)) return;
      const rep = n.repeat || 'day';
      if (periodKey(n.doneAt || 0, rep) !== periodKey(now, rep)) { n.done = false; delete n.doneAt; renderNote(n); back++; }
    });
    if (back) { renderCount(); save(); say(`งานประจำกลับมาแล้ว ${back} อัน`); }
  }

  // ---------- stickers ----------
  const stickerEl = (id) => layer.querySelector(`.sticker[data-id="${id}"]`);
  function renderSticker(k, pop) {
    let el = stickerEl(k.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'sticker';
      el.dataset.id = k.id;
      el.innerHTML = Stickers.svg(k.k) + '<button class="s-del" title="เอาออก">×</button><span class="s-size" title="ปรับขนาด">⤡</span>';
      layer.appendChild(el);
      if (pop) { el.classList.add('pop'); el.addEventListener('animationend', () => el.classList.remove('pop'), { once: true }); }
    }
    el.style.left = k.x + 'px'; el.style.top = k.y + 'px';
    el.style.width = el.style.height = k.s + 'px';
    el.style.zIndex = k.z;
    el.style.setProperty('--rot', k.rot + 'deg');
    return el;
  }
  function addSticker(key) {
    const c = toBoard(innerWidth / 2, innerHeight / 2);
    const s = /urgent|important|waiting/.test(key) ? 150 : 110;
    const k = { id: uid(), k: key, x: Math.round(c.x - s / 2 + Math.random() * 300 - 150), y: Math.round(c.y - s / 2 + Math.random() * 200 - 100),
      s, rot: +(Math.random() * 16 - 8).toFixed(1), z: ++state.z };
    state.stickers.push(k); renderSticker(k, true); save();
    burstAt(k);
  }
  function burstAt(k) {
    const r = stickerEl(k.id).getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, '#FFD84D');
  }
  const tray = $('#stickerTray');
  Stickers.keys.forEach((key) => {
    const b = document.createElement('button');
    b.innerHTML = Stickers.svg(key);
    b.addEventListener('click', () => { addSticker(key); });
    tray.appendChild(b);
  });
  $('#stickerBtn').addEventListener('click', (e) => { e.stopPropagation(); tray.hidden = !tray.hidden; });
  document.addEventListener('click', (e) => { if (!e.target.closest('.sticker-wrap')) tray.hidden = true; });

  layer.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.sticker'); if (!el) return;
    if (e.target.closest('.s-del')) return;
    e.stopPropagation(); e.preventDefault();
    if (editingId) endEdit();
    lastActivity = Date.now();
    const k = state.stickers.find((x) => x.id === el.dataset.id); if (!k) return;
    k.z = ++state.z; el.style.zIndex = k.z;
    const resizing = !!e.target.closest('.s-size');
    const sx = e.clientX, sy = e.clientY, o = { ...k };
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    const move = (ev) => {
      const dx = (ev.clientX - sx) / state.view.s, dy = (ev.clientY - sy) / state.view.s;
      if (resizing) k.s = Math.round(Math.min(420, Math.max(50, o.s + (dx + dy) / 2)));
      else { k.x = Math.round(o.x + dx); k.y = Math.round(o.y + dy); }
      renderSticker(k);
    };
    const up = () => {
      el.classList.remove('dragging');
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      save();
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  layer.addEventListener('click', (e) => {
    const del = e.target.closest('.s-del'); if (!del) return;
    const id = del.closest('.sticker').dataset.id;
    const k = state.stickers.find((x) => x.id === id); if (!k) return;
    state.stickers = state.stickers.filter((x) => x !== k);
    stickerEl(id).remove();
    undoStack.push({ notes: [], zones: [], stickers: [{ ...k }] });
    showToast('เอาสติกเกอร์ออกแล้ว');
    save();
  });

  // ---------- toolbar ----------
  const sw = $('#swatches');
  COLORS.forEach((col, i) => {
    const b = document.createElement('button');
    b.style.setProperty('--c', col.c);
    b.style.setProperty('--r', [-6, 4, -3, 5, -4, 3][i] + 'deg');
    b.title = 'แปะโน้ตสี' + col.name;
    b.textContent = '+';
    b.addEventListener('click', () => addNoteInView(col.c));
    sw.appendChild(b);
  });
  $('#fontSelect').addEventListener('change', (e) => { state.font = e.target.value; renderAll(); save(); });
  [...$('#fontSelect').options].forEach((o) => { o.style.fontFamily = o.value; });
  $('#toggleDone').addEventListener('click', () => { state.hideDone = !state.hideDone; renderAll(); save(); });
  $('#clearDone').addEventListener('click', () => {
    const ids = state.notes.filter((n) => n.done && !inRoutine(n)).map((n) => n.id);
    if (ids.length) removeNotes(ids, `เก็บไป ${ids.length} งานที่เสร็จแล้ว`);
  });
  $('#zoomIn').addEventListener('click', () => zoomAt(innerWidth / 2, innerHeight / 2, 1.2));
  $('#zoomOut').addEventListener('click', () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2));
  $('#zoomLabel').addEventListener('click', () => {
    const c = toBoard(innerWidth / 2, innerHeight / 2);
    animateView({ s: 1, x: innerWidth / 2 - c.x, y: innerHeight / 2 - c.y });
  });
  $('#fitAll').addEventListener('click', () => fitAll());

  const menu = $('#menu');
  $('#menuBtn').addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu-wrap')) menu.hidden = true; });
  menu.addEventListener('click', (e) => { if (e.target.closest('button')) menu.hidden = true; });

  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ app: 'paekaikon', version: 1, ...state }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `paekaikon-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.notes)) throw new Error('bad');
      state = { ...seed(), ...data, notes: data.notes, zones: Array.isArray(data.zones) ? data.zones : defaultZones(), stickers: Array.isArray(data.stickers) ? data.stickers : [] };
      state.buddy = { ...Character.DEFAULT_LOOK, ...(state.buddy || {}) };
      showTitle();
      layer.innerHTML = '';
      renderAll(); state.stickers.forEach((k) => renderSticker(k)); applyView(); save(); fitAll();
      say('เปิดกระดานเดิมให้แล้วน้า');
    } catch (err) { say('ไฟล์นี้เปิดไม่ได้ ลองไฟล์อื่นนะ'); }
    e.target.value = '';
  });
  $('#addZoneBtn').addEventListener('click', addZone);
  $('#fullBtn').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  });
  $('#wipeBtn').addEventListener('click', () => {
    if (!state.notes.length) return;
    removeNotes(state.notes.map((n) => n.id), 'ล้างกระดานแล้ว');
  });

  // install (PWA)
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; $('#installBtn').hidden = false; });
  $('#installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null; $('#installBtn').hidden = true;
  });
  window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; say('ย้ายมาอยู่ในเครื่องแล้ว เย้'); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // keyboard
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('.text, input, select, .brand-name, .zone-title')) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    else if (e.key === 'n' || e.key === 'N' || e.key === 'ด') { e.preventDefault(); addNoteInView(); }
    else if (e.key === '0' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); fitAll(); }
    else if ((e.key === '=' || e.key === '+') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 1.2); }
    else if (e.key === '-' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2); }
  });

  // ---------- toast ----------
  let toastTimer;
  function showToast(msg) {
    $('#toastMsg').textContent = msg;
    $('#toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { $('#toast').hidden = true; }
  $('#toastUndo').addEventListener('click', undo);

  // ---------- confetti ----------
  function burst(x, y, color) {
    const fx = $('#fx');
    const palette = [color, ...COLORS.map((c) => c.c)];
    for (let i = 0; i < 22; i++) {
      const b = document.createElement('i');
      b.className = 'bit';
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 120;
      b.style.left = x + 'px'; b.style.top = y + 'px';
      b.style.background = palette[i % palette.length];
      b.style.setProperty('--dx', Math.cos(a) * d + 'px');
      b.style.setProperty('--dy', Math.sin(a) * d - 40 + 'px');
      b.style.setProperty('--rr', (Math.random() * 540 - 270) + 'deg');
      fx.appendChild(b);
      setTimeout(() => b.remove(), 950);
    }
  }

  // ---------- buddy ----------
  const buddyBody = $('#buddyBody'), bubble = $('#bubble');
  let currentPose = '', currentMsg = '', lastMood = '';
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  function mood() {
    const now = Date.now();
    const total = state.notes.length, left = state.notes.filter((n) => !n.done).length;
    if (draggingId) return 'carry';
    if (now < cheerUntil) return 'cheer';
    if (editingId) return 'write';
    if (now < waveUntil) return 'wave';
    if (!total) return 'sleep';
    if (!left) return 'tea';
    if (now - lastActivity > 120000) return 'sleep';
    return 'idle';
  }
  const WATER_LINE = 'งานเยอะจัง พักกินน้ำบ้างนะ';
  function lineFor(m) {
    const total = state.notes.length;
    const done = state.notes.filter((n) => n.done).length, left = total - done;
    switch (m) {
      case 'wave': return left ? `ฮัลโหล! วันนี้มี ${left} งานน้า` : 'ฮัลโหล! วันนี้จะแปะอะไรดี';
      case 'write': return pick(['จดไว้ก่อน กันลืม', 'อันนี้สำคัญใช่มั้ย', 'เขียนสั้น ๆ ก็พอน้า']);
      case 'carry': return pick(['ย้ายไปตรงไหนดี', 'ฮึบ! หนักนิดนึง', 'วางตรงนี้ดีมั้ย']);
      case 'sleep': return total ? 'งีบแป๊บนึงนะ Zzz' : 'กระดานว่างเลย งีบก่อนนะ';
      case 'tea': return pick(['เสร็จหมดแล้ว จิบชาหน่อย', 'วันนี้เก่งมากเลย', 'ไม่เหลืองานแล้ว เย้']);
      default:
        return pick([
          `เหลืออีก ${left} งาน สู้ ๆ`,
          `ค่อย ๆ ทำทีละอันก็ได้`,
          done ? `ทำไปแล้ว ${done} งาน เก่งมาก` : `เริ่มจากอันที่ง่ายสุดก่อนมั้ย`,
          left > 6 ? WATER_LINE : 'วันนี้ไหวอยู่แล้ว',
        ]);
    }
  }
  function say(msg) {
    if (msg === currentMsg) return;
    currentMsg = msg;
    bubble.classList.add('swap');
    setTimeout(() => { bubble.textContent = msg; bubble.classList.remove('swap'); }, 160);
  }
  function sayCheer() {
    const left = state.notes.filter((n) => !n.done).length;
    say(left ? pick(['เย้ เสร็จไปอีกอัน!', 'เก่งมากกก', `อีกแค่ ${left} งานเอง`]) : 'เสร็จครบทุกงานแล้ว!');
  }
  function updateBuddy() {
    const m = mood();
    const pose = m === 'idle' && currentMsg === WATER_LINE ? 'drink' : m; // holds a glass while reminding to drink
    if (pose !== currentPose) {
      const editing = editingId && byId(editingId);
      const dragging = draggingId && byId(draggingId);
      buddyBody.innerHTML = Character.render(pose, (dragging || editing || {}).color, state.buddy);
      currentPose = pose;
    }
    if (m !== lastMood) {
      if (m !== 'cheer') say(lineFor(m));
      lastMood = m;
    }
  }
  // ---------- look panel ----------
  const LOOK_OPTS = {
    hair: [['long', 'ยาว'], ['bob', 'บ็อบ'], ['pony', 'มัดผม'], ['short', 'สั้น'], ['sidepart', 'แสกข้าง'], ['curly', 'หยิก']],
    hairColor: ['#1b1b1b', '#6B4128', '#B5763C', '#E8C15A', '#F49CB8', '#7CB8E8', '#A0A0A0'],
    skin: ['#ffffff', '#FDE7D6', '#F2C9A6', '#D9A37C', '#B0784F', '#7E5136'],
    shirt: ['#ffffff', '#FFE98A', '#FFC6D3', '#BDE3FF', '#C9F0C2', '#DCCBFF', '#3b3b3b'],
    note: COLORS.map((c) => c.c),
  };
  const panel = $('#lookPanel');
  function renderLookPanel() {
    const L = state.buddy;
    panel.querySelectorAll('.opts').forEach((box) => {
      const key = box.dataset.key;
      if (!box.children.length) {
        LOOK_OPTS[key].forEach((o) => {
          const b = document.createElement('button');
          if (Array.isArray(o)) { b.className = 'txt'; b.dataset.v = o[0]; b.textContent = o[1]; }
          else { b.dataset.v = o; b.style.setProperty('--c', o); }
          box.appendChild(b);
        });
      }
      if (key === 'hair') [...box.children].forEach((b) => { b.className = 'hair-thumb'; b.title = b.dataset.label || (b.dataset.label = b.textContent); b.innerHTML = Character.thumb({ ...L, hair: b.dataset.v, note: L.note }); });
      [...box.children].forEach((b) => b.classList.toggle('on', b.dataset.v.toLowerCase() === String(L[key]).toLowerCase()));
    });
    panel.querySelectorAll('input[data-key]').forEach((i) => { i.checked = !!L[i.dataset.key]; });
  }
  function applyLook() {
    $('#buddy').classList.toggle('hidden', !state.buddy.show);
    currentPose = '';
    updateBuddy();
    renderLookPanel();
    save();
  }
  panel.addEventListener('click', (e) => {
    const b = e.target.closest('.opts button'); if (!b) return;
    state.buddy[b.closest('.opts').dataset.key] = b.dataset.v;
    applyLook();
  });
  panel.addEventListener('change', (e) => {
    const k = e.target.dataset.key; if (!k) return;
    state.buddy[k] = e.target.checked;
    applyLook();
  });
  const openLook = () => { renderLookPanel(); panel.hidden = false; $('#buddy').classList.add('dressing'); };
  $('#lookBtn').addEventListener('click', openLook);
  $('#dressBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.hidden) openLook(); else { panel.hidden = true; $('#buddy').classList.remove('dressing'); }
  });
  $('#lookClose').addEventListener('click', () => { panel.hidden = true; $('#buddy').classList.remove('dressing'); });
  $('#lookReset').addEventListener('click', () => { state.buddy = { ...Character.DEFAULT_LOOK }; applyLook(); });

  buddyBody.addEventListener('click', () => {
    lastActivity = Date.now();
    buddyBody.classList.remove('boing'); void buddyBody.offsetWidth; buddyBody.classList.add('boing');
    if (currentPose === 'sleep' && state.notes.length) { waveUntil = Date.now() + 2500; updateBuddy(); return; }
    say(lineFor(mood() === 'wave' ? 'idle' : mood()));
    updateBuddy();
  });
  ['pointerdown', 'keydown', 'wheel'].forEach((ev) => addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true }));
  setInterval(updateBuddy, 1000);

  // ---------- go ----------
  // board title: the person's own name for their board
  const APP_NAME = 'แปะไว้ก่อน';
  const titleEl = $('#boardTitle');
  const showTitle = () => { titleEl.textContent = state.title || APP_NAME; document.title = state.title || APP_NAME; };
  titleEl.contentEditable = 'plaintext-only';
  if (titleEl.contentEditable !== 'plaintext-only') titleEl.contentEditable = 'true';
  titleEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); titleEl.blur(); } });
  titleEl.addEventListener('blur', () => { const t = titleEl.textContent.trim().slice(0, 40); state.title = t && t !== APP_NAME ? t : ''; showTitle(); save(); });
  showTitle();

  if (!Array.isArray(state.stickers)) state.stickers = [];
  state.stickers.forEach((k) => renderSticker(k));
  state.buddy = { ...Character.DEFAULT_LOOK, ...(state.buddy || {}) };
  if (state.buddy.hair === 'bun') state.buddy.hair = 'pony';
  $('#buddy').classList.toggle('hidden', !state.buddy.show);
  applyView();
  renderAll();
  resetRoutines();
  setInterval(resetRoutines, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resetRoutines(); });
  fitAll(true);
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => fitAll(true), 120); });
  addEventListener('beforeunload', () => { if (editingId) endEdit(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} });
})();

</script>
</body>
</html>
